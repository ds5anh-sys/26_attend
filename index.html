<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연수 QR 출석 (카메라 + 리더기)</title>

<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="text-align:center; font-family:sans-serif;">

<h2>연수 QR 출석 스캔</h2>

<div id="reader" style="width:300px; margin:auto;"></div>

<p id="result"
style="font-size:22px; margin-top:20px; white-space:pre-line;">
대기중...
</p>

<audio id="successSound"
src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<audio id="failSound"
src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

<br><br>

<button onclick="startCamera()"
style="font-size:20px; padding:10px;">
📷 카메라 시작
</button>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbzf5VDhh9G_s61Vr83U32t79Xsxx4PLt47FaBn5Yf2QOuXT9qBwPS8r2mVkvmIGoCNxVg/exec";

// 🔥 출석일 설정
const DAY = "1"; // 2일차는 "2"

let scanner;

// 🔥 중복 스캔 방지
let lastScan = "";
let lastTime = 0;

// 🔥 서버 처리중 잠금
let isProcessing = false;

// 🔥 리더기 입력 버퍼
let keyBuffer = "";

// 🔥 마지막 입력 시간
let lastKeyTime = 0;

// 🔥 버퍼 초기화 시간(ms)
const BUFFER_RESET = 200;

// 🔥 문자열 정리
function cleanCode(raw){

  if(!raw) return "";

  raw = raw.trim();

  // URL 형태 대응
  const match = raw.match(/code=([A-Za-z0-9]+)/i);

  if(match){
    raw = match[1];
  }

  // 영문/숫자만 남김
  raw = raw.replace(/[^A-Z0-9]/gi, '').toUpperCase();

  // 🔥 영문1 + 숫자3 패턴 추출
  const found = raw.match(/[A-Z][0-9]{3}/);

  if(found){
    return found[0];
  }

  return "";
}

// 🔥 화면 효과
function flash(color){

  const d = document.createElement("div");

  d.style.position = "fixed";
  d.style.top = 0;
  d.style.left = 0;
  d.style.width = "100%";
  d.style.height = "100%";
  d.style.background = color;
  d.style.opacity = "0.4";
  d.style.zIndex = "9999";

  document.body.appendChild(d);

  setTimeout(() => {
    d.remove();
  }, 150);
}

// 🔥 리더기 직접 입력 감지 (핵심)
window.addEventListener("keydown", function(e){

  // 처리중이면 무시
  if(isProcessing) return;

  const now = Date.now();

  // 오래 멈췄으면 버퍼 초기화
  if(now - lastKeyTime > BUFFER_RESET){
    keyBuffer = "";
  }

  lastKeyTime = now;

  // Enter 무시
  if(e.key === "Enter"){
    e.preventDefault();
    return;
  }

  // 1글자만 허용
  if(e.key.length !== 1) return;

  // 영문/숫자만 누적
  if(/[A-Za-z0-9]/.test(e.key)){
    keyBuffer += e.key.toUpperCase();
  }

  // 🔥 너무 길면 뒤 10글자만 유지
  if(keyBuffer.length > 10){
    keyBuffer = keyBuffer.slice(-10);
  }

  // 🔥 코드 추출
  const code = cleanCode(keyBuffer);

  if(!code) return;

  // 🔥 즉시 버퍼 초기화
  keyBuffer = "";

  onScanSuccess(code);
});

// 🚀 공통 처리
function onScanSuccess(code){

  // 처리중 차단
  if(isProcessing) return;

  const now = Date.now();

  // 🔥 동일 QR 연속 차단
  if(code === lastScan && now - lastTime < 1000){
    return;
  }

  lastScan = code;
  lastTime = now;

  isProcessing = true;

  // 🔥 안전장치
  setTimeout(() => {
     isProcessing = false;
  }, 2000);
  

  fetch(
    API_URL +
    "?action=checkin" +
    "&day=" + DAY +
    "&code=" + encodeURIComponent(code) +
    "&ts=" + Date.now(),
    {
      cache:"no-store"
    }
  )
  .then(r => r.text())
  .then(t => {

    let d;

    try{
      d = JSON.parse(t);

    }catch(err){

      document.getElementById("result").innerText =
        "⚠️ 서버 응답 오류";

      flash("orange");

      return;
    }

    // ✅ 출석 성공
    if(d.status === "SUCCESS"){

      document.getElementById("result").innerText =
        `✅ ${d.name} (${d.school})\n🕒 ${d.time}`;

      successSound.play();

      flash("green");

    // ⚠️ 이미 출석
    }else if(d.status === "ALREADY"){

      document.getElementById("result").innerText =
        `⚠️ 이미 출석\n${d.name}`;

      failSound.play();

      flash("yellow");

    // ❌ 미등록
    }else{

      document.getElementById("result").innerText =
        `❌ 미등록\n${code}`;

      failSound.play();

      flash("red");
    }
  })
  .catch(() => {

    document.getElementById("result").innerText =
      "⚠️ 서버 연결 실패";

    flash("red");

  })
  .finally(() => {

     isProcessing = false;
  });
}

// 🚀 카메라
function startCamera(){

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode:"environment" },
    {
      fps:20,
      qrbox:200
    },
    (decodedText) => {

      const code = cleanCode(decodedText);

      if(code){
        onScanSuccess(code);
      }
    }
  );
}
</script>

</body>
</html>
