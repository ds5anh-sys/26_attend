<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활기록부 연수 출석 현황</title>

<style>
body {
  margin:0;
  font-family: sans-serif;
  background: #020617;
  color: white;
  text-align: center;
}

#bigName {
  font-size: 80px;
  font-weight: bold;
  margin-top: 100px;
}

#school {
  font-size: 40px;
  margin-top: 10px;
  color: #94a3b8;
}

#time {
  font-size: 30px;
  margin-top: 10px;
  color: #38bdf8;
}

.flash {
  animation: pop 0.5s ease;
}

@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

#recentBox {
  position: fixed;
  bottom: 140px;
  width: 100%;
}

#recentTitle {
  font-size: 20px;
  margin-bottom: 10px;
  color: #cbd5f5;
}

#recentList {
  font-size: 18px;
}

#footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #0f172a;
  padding: 15px;
}

#barBox {
  display: flex;
  justify-content: center;
  gap: 60px;
}

.barWrap {
  width: 180px;
}

.barLabel {
  font-size: 16px;
  color: #cbd5f5;
}

.bar {
  height: 14px;
  margin-top: 8px;
  border-radius: 7px;
  width: 0%;
  transition: width 0.6s ease;
}

/* 🔥 색상 */
#bar1 { background: #3b82f6; } /* 파랑 */
#bar2 { background: #22c55e; } /* 초록 */

.count {
  margin-top: 6px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="bigName">대기중...</div>
<div id="school"></div>
<div id="time"></div>

<div id="recentBox">
  <div id="recentTitle">최근 출석자</div>
  <div id="recentList"></div>
</div>

<div id="footer">
  <div id="barBox">

    <div class="barWrap">
      <div class="barLabel">창원권 (5/8)</div>
      <div class="bar" id="bar1"></div>
      <div class="count" id="count1"></div>
    </div>

    <div class="barWrap">
      <div class="barLabel">마산진해권 (5/11)</div>
      <div class="bar" id="bar2"></div>
      <div class="count" id="count2"></div>
    </div>

  </div>
</div>

<script>
const API_URL = "여기에_네_앱스크립트_URL";

let lastName = "";

// 시간 포맷
function formatTime(t) {
  if (!t) return "";

  if (typeof t === "string" && t.includes("-") && t.includes(":")) {
    return t;
  }

  const d = new Date(t);
  if (isNaN(d)) return "";

  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  const hh = String(d.getHours()).padStart(2,"0");
  const min = String(d.getMinutes()).padStart(2,"0");

  return `${mm}-${dd} ${hh}:${min}`;
}

// 🚀 데이터 로드
function loadData(){
  fetch(API_URL + "?action=dashboard")
  .then(res => res.json())
  .then(data => {

    if (!data.list.length) return;

    const latest = data.list[0];

    // 전광판
    if (latest.name !== lastName) {
      lastName = latest.name;

      bigName.innerText = latest.name;
      school.innerText = latest.school;
      time.innerText = "🕒 " + formatTime(latest.time);

      bigName.classList.remove("flash");
      void bigName.offsetWidth;
      bigName.classList.add("flash");
    }

    // 최근 10명
    recentList.innerHTML = "";
    data.list.slice(1, 11).forEach(p => {
      const div = document.createElement("div");
      div.innerText = `${p.name} (${p.school}) - ${formatTime(p.time)}`;
      recentList.appendChild(div);
    });

    // 🔥 출석율 계산
    const rate1 = data.day1Total ? Math.round(data.day1 / data.day1Total * 100) : 0;
    const rate2 = data.day2Total ? Math.round(data.day2 / data.day2Total * 100) : 0;

    // 🔥 그래프
    bar1.style.width = rate1 + "%";
    bar2.style.width = rate2 + "%";

    // 🔥 텍스트 표시 (핵심)
    count1.innerText = `창원권 ${rate1}% (${data.day1}/${data.day1Total})`;
    count2.innerText = `마산진해권 ${rate2}% (${data.day2}/${data.day2Total})`;

  });
}

setInterval(loadData, 3000);
loadData();
</script>

</body>
</html>
