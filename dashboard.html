<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활기록부 및 학적 업무담당자 연수 출석 현황</title>

<style>
body {
  margin:0;
  font-family: sans-serif;
  background: #020617;
  color: white;
  text-align: center;
}

#bigName {
  font-size: 80px;
  font-weight: bold;
  margin-top: 100px;
}

#school {
  font-size: 40px;
  margin-top: 10px;
  color: #94a3b8;
}

#time {
  font-size: 30px;
  margin-top: 10px;
  color: #38bdf8;
}

.flash {
  animation: pop 0.5s ease;
}

@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

#recentBox {
  position: fixed;
  bottom: 120px;
  width: 100%;
}

#recentTitle {
  font-size: 20px;
  margin-bottom: 10px;
}

#recentList {
  font-size: 18px;
  line-height: 1.6;
}

#footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #0f172a;
  padding: 20px;
}

#barBox {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.barWrap {
  width: 500px;
}

.barLabel {
  font-size: 16px;
}

.bar {
  height: 14px;
  margin-top: 6px;
  border-radius: 6px;
  width: 0%;
  transition: width 0.6s;
}

#bar1 { background: #3b82f6; } /* 파랑 */
#bar2 { background: #22c55e; } /* 초록 */

.count {
  margin-top: 6px;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="bigName">대기중...</div>
<div id="school"></div>
<div id="time"></div>

<div id="recentBox">
  <div id="recentTitle">최근 출석자</div>
  <div id="recentList"></div>
</div>

<div id="footer">
  <div id="barBox">
    <div class="barWrap">
      <div class="barLabel">창원권 (5월8일)</div>
      <div class="bar" id="bar1"></div>
      <div class="count" id="count1"></div>
    </div>

    <div class="barWrap">
      <div class="barLabel">마산진해권 (5월11일)</div>
      <div class="bar" id="bar2"></div>
      <div class="count" id="count2"></div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw6Op1r73gq8PGg6xqLFa45NFmB58ssRgPn25MOOi1eEJ09RQO6fC2G7Wb7Xwb8L-kb/exec";

let lastName = "";

// 🔥 시간 그대로 출력 (핵심 수정)
function formatTime(t) {
  if (!t) return "";

  // 이미 MM-dd HH:mm 형태면 그대로 사용
  if (typeof t === "string" && t.length <= 16 && t.includes("-") && t.includes(":")) {
    return t;
  }

  const d = new Date(t);
  if (isNaN(d)) return "";

  // 🔥 한국시간 변환 (핵심)
  // const k = new Date(d.getTime() + 9 * 60 * 60 * 1000); 이거 때문에 9시간이 더해져서 보여짐

  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const hh = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");

  return `${mm}-${dd} ${hh}:${min}`;
}

function loadData(){
 // fetch(API_URL + "?action=dashboard") 수정했음 최근 데이터
  fetch(API_URL + "?action=dashboard&ts=" + Date.now())
  .then(res => res.json())
  .then(data => {

  //  if (!data.list || !data.list.length) return; 최근 출석이 없으면 함수자체가 종료됨

    const latest = data.list[0];

    // 전광판
    if (latest.name !== lastName) {
      lastName = latest.name;

      document.getElementById("bigName").innerText = latest.name;
      document.getElementById("school").innerText = latest.school;
      document.getElementById("time").innerText = "🕒 " + formatTime(latest.time);
    }

    // 최근 10명
    const listEl = document.getElementById("recentList");
    listEl.innerHTML = "";

    data.list.slice(1, 9).forEach(p => {
      const div = document.createElement("div");
      div.innerText =
        `${p.name} (${p.school}) - ${formatTime(p.time)}`;
      listEl.appendChild(div);
    });

    // 🔥 안전값 처리
    const day1 = data.day1 || 0;
    const day2 = data.day2 || 0;
    const day1Total = data.day1Total || 0;
    const day2Total = data.day2Total || 0;

    // 🔥 출석율 계산
    const rate1 = day1Total ? Math.round(day1 / day1Total * 100) : 0;
    const rate2 = day2Total ? Math.round(day2 / day2Total * 100) : 0;

    // 🔥 그래프 길이 (비율 기반)
    document.getElementById("bar1").style.width = rate1 + "%";
    document.getElementById("bar2").style.width = rate2 + "%";

    // 🔥 텍스트 표시 (핵심)
    document.getElementById("count1").innerText =
      `창원권 ${rate1}% (${day1}/${day1Total})`;

    document.getElementById("count2").innerText =
      `마산진해권 ${rate2}% (${day2}/${day2Total})`;
  });
}

setInterval(loadData, 3000);
loadData();
</script>

</body>
</html>
